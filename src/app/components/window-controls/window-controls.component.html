<!-- window-controls.html -->
<div class="window-controls" [style]="{'background-color': options().transparent ? 'transparent' : options().backgroundColor}">
  <div class="control-button-group">

    @if(options().showCloseButton){
    <button class="window-close" title="关闭">
      <nz-icon nzType="close" nzTheme="outline" class="btn-icon" (click)="close()">
      </nz-icon>
    </button>
    }

    @if(options().showMinimizeButton){
    <button class="window-minimize" title="最小化">
      <nz-icon nzType="minus" nzTheme="outline" class="btn-icon" (click)="minimize()" />
    </button>
    }

    @if(options().showMaximizeButton){
    <button class="window-maximize" title="最大化">
      <nz-icon nzType="plus" nzTheme="outline" class="btn-icon" (click)="maximize()" />
    </button>
    }

    @if(options().showMenuButton){
    <button class="window-menu" title="菜单">
      <nz-icon [nzType]="isCollapsed ? 'left-square' : 'right-square'" nzTheme="outline" (click)="changeCollapse()" />
    </button>
    }
  </div>
  <div class="title" [style]="{'color':options().color}">{{ this.options().title }}</div>
</div>
