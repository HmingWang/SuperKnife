<nz-card nzTitle="HTTP 请求调试工具" class="http-requester">
  <div class="row">
    <nz-select [(ngModel)]="method" style="width: 100px; margin-right: 8px;">
      <nz-option nzValue="GET" nzLabel="GET"></nz-option>
      <nz-option nzValue="POST" nzLabel="POST"></nz-option>
    </nz-select>

    <input nz-input placeholder="输入请求 URL" [ngModel]="url()" (ngModelChange)="url.set($event)" style="flex: 1" />
    <button nz-button nzType="primary" [nzLoading]="loading()" (click)="sendRequest()" style="margin-left: 8px;">
      发送
    </button>
  </div>

  <!-- 参数 -->
  <div class="param-section">
    <label>请求参数：</label>
    <div *ngFor="let p of params(); let i = index" class="param-item">
      <input nz-input placeholder="key" [(ngModel)]="p.key" style="width: 45%; margin-right: 8px" />
      <input nz-input placeholder="value" [(ngModel)]="p.value" style="width: 45%; margin-right: 8px" />
      <button nz-button nzType="text" nzDanger (click)="removeParam(i)">删除</button>
    </div>
    <button nz-button nzType="dashed" (click)="addParam()">+ 添加参数</button>
  </div>

  <!-- Header -->
  <div class="header-section">
    <label>请求头：</label>
    <div *ngFor="let h of headers(); let i = index" class="param-item">
      <input nz-input placeholder="Header 名" [(ngModel)]="h.key" style="width: 45%; margin-right: 8px" />
      <input nz-input placeholder="Header 值" [(ngModel)]="h.value" style="width: 45%; margin-right: 8px" />
      <button nz-button nzType="text" nzDanger (click)="removeHeader(i)">删除</button>
    </div>
    <button nz-button nzType="dashed" (click)="addHeader()">+ 添加 Header</button>
  </div>

  <!-- Body -->
  <div *ngIf="isPost()" class="body-section">
    <label>请求体（JSON）：</label>
    <textarea
      nz-input
      [(ngModel)]="body"
      rows="6"
      placeholder='{"key": "value"}'
    ></textarea>
  </div>
</nz-card>

<nz-card nzTitle="响应结果" *ngIf="result()">
  <pre>{{ result() | json }}</pre>
</nz-card>
